name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install -r tools/requirements.txt
      - name: Validate assets
        run: python tools/assets.py validate
      - name: Check catalog is current
        run: python tools/assets.py catalog --check
